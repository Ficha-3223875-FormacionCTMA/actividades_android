name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Pruebas, Lint y APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDevDebugUnitTest

      - name: Ejecutar Android Lint
        run: ./gradlew lintDevDebug

      - name: Configurar emulador Android y ejecutar pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDevDebugAndroidTest

      - name: Generar APK Dev Debug
        run: ./gradlew assembleDevDebug

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiFormacionCTMA-APK
          path: app/build/outputs/apk/devDebug/*.apk